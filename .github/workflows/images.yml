# Publishes the three images docker-compose.quickstart.yml pulls, for amd64 and arm64 on native runners.
# A v* tag publishes x.y.z, x.y and latest (a pre-release such as v0.2.0-rc.1 publishes only its own tag); main publishes edge.
name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/paodo-solution

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [app, credproxy, sandbox]
        arch: [amd64, arm64]
        include:
          - { image: app, name: paodo-workspaces, file: Dockerfile, target: runner }
          - { image: credproxy, name: paodo-workspaces-credproxy, file: Dockerfile.credproxy, target: "" }
          - { image: sandbox, name: paodo-workspaces-sandbox, file: Dockerfile.workspace, target: "" }
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7

      # The app accepts a pulled sandbox only if this label equals its own hash of Dockerfile.workspace (dockerfileHasher.ts).
      - name: Labels
        id: labels
        run: |
          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
            echo "org.opencontainers.image.revision=${{ github.sha }}"
            if [ "${{ matrix.image }}" = sandbox ]; then
              echo "paodo.workspace-hash=$(sha256sum Dockerfile.workspace | cut -c1-16)"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.labels.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: app, name: paodo-workspaces }
          - { image: credproxy, name: paodo-workspaces-credproxy }
          - { image: sandbox, name: paodo-workspaces-sandbox }
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=edge,branch=main
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ matrix.name }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ matrix.name }}:${{ steps.meta.outputs.version }}"
